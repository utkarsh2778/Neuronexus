<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Google Form | Web Form </title>
<link rel="stylesheet" href="landingpage.css" />
</head>
<body>
  <form>
    <h2>Google Form | Web Form</h2>

    <div class="form-group">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required autocomplete="name" />
    </div>

    <div class="form-group">
      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" name="contact" required autocomplete="tel" pattern="[0-9+()-\s]*" />
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <textarea id="address" name="address" required autocomplete="street-address"></textarea>
    </div>

    <div class="form-group">
      <label for="company">Company Name</label>
      <input type="text" id="company" name="company" autocomplete="organization" />
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required autocomplete="email" />
    </div>

    <div class="form-group">
      <label for="department">Department</label>
      <select id="department" name="department" required>
        <option value="" disabled selected>Select an option</option>
        <option value="HR">HR</option>
        <option value="Sales">Sales</option>
        <option value="Development">Development</option>
        <option value="Marketing">Marketing</option>
        <option value="Others">Others</option>
      </select>
    </div>

    <div class="form-group">
      <label>Gender</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="gender" value="Male" required />
          Male
        </label>
        <label>
          <input type="radio" name="gender" value="Female" />
          Female
        </label>
        <label>
          <input type="radio" name="gender" value="Prefer not to say" />
          Prefer not to say
        </label>
      </div>
    </div>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
